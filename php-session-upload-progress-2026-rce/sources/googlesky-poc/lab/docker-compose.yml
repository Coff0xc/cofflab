# Vulnerable lab for CVE-2026-115560
# (PHP session upload progress + runtime serialize_handler switch => RCE)
#
#   vuln-php       127.0.0.1:8094  php_serialize config + upload_progress ON (default)
#   mitigated-php  127.0.0.1:8097  same code, session.upload_progress.enabled=0
#                                   (the official php.net mitigation)
services:
  vuln-php:
    build: .
    image: cve-2026-115560-lab:latest
    container_name: cve115560-vuln
    ports:
      - "127.0.0.1:8094:80"
    volumes:
      - ./conf/99-vuln.ini:/usr/local/etc/php/conf.d/99-lab.ini:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/info.php"]
      interval: 5s
      timeout: 3s
      retries: 12

  mitigated-php:
    image: cve-2026-115560-lab:latest
    container_name: cve115560-mitigated
    depends_on:
      vuln-php:
        condition: service_started
    ports:
      - "127.0.0.1:8097:80"
    volumes:
      - ./conf/99-mitigated.ini:/usr/local/etc/php/conf.d/99-lab.ini:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/info.php"]
      interval: 5s
      timeout: 3s
      retries: 12
